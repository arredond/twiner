[project]
name = "twiner-flood"
version = "0.1.0"
description = "twiner pipeline: MITECO SNCZI flood zones -> flood_zones.pmtiles + per-building flood exposure"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pyarrow>=17.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flood"]
