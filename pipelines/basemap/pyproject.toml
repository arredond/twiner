[project]
name = "twiner-basemap"
version = "0.1.0"
description = "twiner pipeline: Protomaps daily build -> regional basemap PMTiles + fonts/sprites"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basemap"]
